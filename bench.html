<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Halftone Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  /* Committed single-theme: a darkroom instrument. Every colour painted
     explicitly so the page holds on either host ground. */
  :root{
    --ground:#0B0C0D;
    --panel:#141517;
    --panel-2:#1B1D20;
    --line:#282A2E;
    --line-soft:#1F2124;
    --ink:#EAE7E1;
    --dim:#84868C;
    --dimmer:#5B5D63;
    --safelight:#D9863B;
    --safelight-dim:#8A5A2A;
    --rail:328px;
    --display:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--display);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    display:grid;
    grid-template-columns:1fr var(--rail);
    grid-template-rows:auto 1fr;
    height:100vh;
    min-height:540px;
  }

  /* ---------- masthead ---------- */
  header{
    grid-column:1 / -1;
    display:flex;
    align-items:baseline;
    gap:18px;
    padding:14px 20px;
    border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  h1{
    font-size:17px;
    font-weight:800;
    letter-spacing:-.02em;
    margin:0;
  }
  .sub{
    font-family:var(--mono);
    font-size:11px;
    color:var(--dim);
    letter-spacing:.01em;
  }
  .presets{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--dim);
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:2px;
    padding:5px 9px;
    cursor:pointer;
  }
  .chip:hover{color:var(--ink);border-color:var(--dimmer)}
  .transport{
    color:var(--ink);
    border-color:var(--dimmer);
    min-width:74px;
  }
  .transport[data-paused=true]{background:var(--safelight);color:#17120C;border-color:var(--safelight)}
  .chip:focus-visible,
  button:focus-visible,
  select:focus-visible,
  input:focus-visible{outline:2px solid var(--safelight);outline-offset:1px}

  /* ---------- stage ---------- */
  .stage{
    position:relative;
    background:
      repeating-conic-gradient(var(--panel) 0% 25%, #101113 0% 50%) 0 0/16px 16px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  canvas{display:block;max-width:100%;max-height:100%}

  .dropnote{
    position:absolute;
    inset:auto 0 0 0;
    padding:10px 16px;
    font-family:var(--mono);
    font-size:11px;
    color:var(--dim);
    pointer-events:none;
    display:flex;
    justify-content:space-between;
    gap:12px;
  }
  /* pills rather than a full-width scrim, so the note stays legible over a
     white ground without smudging the bottom of the image */
  .dropnote span{
    background:rgba(11,12,13,.86);
    padding:4px 8px;
    border-radius:2px;
  }
  .dropnote span:last-child{color:var(--dimmer)}
  @media (max-width:820px){ .dropnote span:last-child{display:none} }
  .stage.drag::after{
    content:"drop clips or stills";
    position:absolute;
    inset:10px;
    border:1px dashed var(--safelight);
    color:var(--safelight);
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(11,12,13,.6);
  }

  /* ---------- rail ---------- */
  .rail{
    border-left:1px solid var(--line);
    background:var(--panel);
    overflow-y:auto;
    overscroll-behavior:contain;
  }
  .module{border-bottom:1px solid var(--line)}
  .module > h2{
    display:flex;
    align-items:center;
    gap:8px;
    margin:0;
    padding:11px 16px 9px;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.13em;
    text-transform:uppercase;
    color:var(--dim);
  }
  .step{
    font-family:var(--mono);
    font-size:10px;
    color:var(--safelight-dim);
    letter-spacing:0;
  }
  .body{padding:0 16px 14px;display:flex;flex-direction:column;gap:9px}

  .row{display:grid;grid-template-columns:74px 1fr 46px;align-items:center;gap:9px}
  .row label{font-size:11.5px;color:var(--dim)}
  .row output{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink);
    text-align:right;
    font-variant-numeric:tabular-nums;
  }

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:2px;background:var(--line);border-radius:2px;margin:0;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:11px;height:11px;border-radius:50%;
    background:var(--ink);border:none;cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:11px;height:11px;border-radius:50%;
    background:var(--ink);border:none;cursor:pointer;
  }
  input[type=range]:hover::-webkit-slider-thumb{background:var(--safelight)}
  input[type=range]:hover::-moz-range-thumb{background:var(--safelight)}

  select{
    font-family:var(--mono);font-size:11px;
    background:var(--panel-2);color:var(--ink);
    border:1px solid var(--line);border-radius:2px;
    padding:4px 6px;width:100%;
  }
  input[type=color]{
    width:100%;height:24px;padding:0;
    background:var(--panel-2);
    border:1px solid var(--line);border-radius:2px;cursor:pointer;
  }

  .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:2px;overflow:hidden}
  .seg button{
    flex:1;
    font-family:var(--mono);font-size:11px;
    background:var(--panel-2);color:var(--dim);
    border:none;padding:5px 0;cursor:pointer;
  }
  .seg button + button{border-left:1px solid var(--line)}
  .seg button[aria-pressed=true]{background:var(--safelight);color:#17120C;font-weight:500}

  /* layer strips */
  .layer{
    border:1px solid var(--line-soft);
    border-radius:3px;
    padding:9px 10px;
    display:flex;flex-direction:column;gap:8px;
    background:var(--panel-2);
  }
  .layer.empty{opacity:.55}
  .layer-head{display:flex;align-items:center;gap:8px}
  .layer-name{
    font-family:var(--mono);font-size:10.5px;
    color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
  }
  .layer.empty .layer-name{color:var(--dimmer)}
  .tag{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
    color:var(--safelight-dim);
  }
  .mini{
    font-family:var(--mono);font-size:10px;
    background:transparent;color:var(--dim);
    border:1px solid var(--line);border-radius:2px;
    padding:3px 7px;cursor:pointer;
  }
  .mini:hover{color:var(--ink);border-color:var(--dimmer)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  .btn{
    font-family:var(--mono);font-size:11px;letter-spacing:.04em;
    background:var(--panel-2);color:var(--ink);
    border:1px solid var(--line);border-radius:2px;
    padding:8px 10px;cursor:pointer;width:100%;
  }
  .btn:hover{border-color:var(--dimmer)}
  .btn.primary{background:var(--safelight);color:#17120C;border-color:var(--safelight);font-weight:500}
  .btn.primary:hover{filter:brightness(1.08)}

  .hint{font-size:11px;line-height:1.5;color:var(--dimmer);margin:0}
  .hint code{font-family:var(--mono);font-size:10.5px;color:var(--dim)}

  textarea{
    width:100%;height:132px;
    font-family:var(--mono);font-size:10px;line-height:1.5;
    background:var(--ground);color:var(--dim);
    border:1px solid var(--line);border-radius:2px;
    padding:8px;resize:vertical;
  }

  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
  }

  @media (max-width:820px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 46vh 1fr}
    .rail{border-left:none;border-top:1px solid var(--line)}
    header{flex-wrap:wrap;gap:10px}
    .presets{margin-left:0;width:100%}
  }
</style>

<div class="app">
  <header>
    <h1>Halftone Bench</h1>
    <span class="sub">bayer ordered dither &middot; live</span>
    <div class="presets" id="presets"></div>
    <button class="chip transport" id="transport" type="button">pause</button>
  </header>

  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div class="dropnote">
      <span id="statusline">loading stand-in footage&hellip;</span>
      <span>drop your own clips anywhere</span>
    </div>
  </div>

  <div class="rail">
    <section class="module">
      <h2><span class="step">01</span> Source</h2>
      <div class="body" id="layers"></div>
    </section>

    <section class="module">
      <h2><span class="step">02</span> Tone</h2>
      <div class="body" id="tone"></div>
    </section>

    <section class="module">
      <h2><span class="step">03</span> Dither</h2>
      <div class="body" id="dither"></div>
    </section>

    <section class="module">
      <h2><span class="step">04</span> Motion</h2>
      <div class="body" id="motion"></div>
    </section>

    <section class="module">
      <h2><span class="step">05</span> Pointer</h2>
      <div class="body" id="pointer"></div>
    </section>

    <section class="module">
      <h2><span class="step">06</span> Output</h2>
      <div class="body" id="output"></div>
    </section>
  </div>
</div>

<input type="file" id="filepick" class="visually-hidden" accept="video/*,image/*" multiple>

<script type="x-shader/x-fragment" id="frag">
precision highp float;

varying vec2 vUv;

uniform vec2  uRes;

uniform sampler2D uTexA, uTexB, uTexC, uStill;
uniform vec2  uArA, uArB, uArC;      // x = source aspect, y = enabled
uniform vec4  uParA, uParB, uParC;   // weight, scale, blend mode, matte mode
uniform vec2  uOffA, uOffB, uOffC;
uniform vec2  uMaskCtl;              // matte threshold, matte softness

uniform vec4  uStillRect;            // x, y, w, h in uv space
uniform vec3  uStillPar;             // on, opacity, blend mode

uniform float uExposure, uContrast, uInvert;
uniform float uGrain, uSeed;
uniform float uMatrix, uDot, uThresh, uCell, uFit;
uniform vec3  uInk, uPaper;
uniform vec2  uKnock;      // blank above, solid below
uniform vec3  uReg;        // registration drift x, y, print exposure wobble
uniform vec4  uPtr;        // pointer x, y, radius, strength
uniform float uPtrMode;    // 0 off, 1 focus, 2 reveal, 3 repel, 4 disperse

/* Disperse keeps a short trail of where the cursor has been, each sample
   fading on its own clock, so dragging scatters the grain and it settles
   back once the cursor leaves. */
#define TRAIL 8
uniform vec4 uTrail[TRAIL];   // x, y, amplitude, unused
uniform vec2 uDisperse;       // radius, strength

float lumOf(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }

/* Recursive Bayer construction. bayer2 gives [[0,2],[3,1]]/4; each level
   folds the previous one in at quarter weight, which is exactly the
   ordered-dither matrix TouchDesigner tiles across the frame. */
float bayer2(vec2 a){ a = floor(a); return fract(a.x * 0.5 + a.y * a.y * 0.75); }
#define bayer4(a) (bayer2(0.5 * (a)) * 0.25 + bayer2(a))
#define bayer8(a) (bayer4(0.5 * (a)) * 0.25 + bayer2(a))

float hash(vec2 p, float s){
  return fract(sin(dot(p, vec2(127.1, 311.7)) + s * 13.77) * 43758.5453);
}

vec2 coverUV(vec2 uv, float texAR, float scrAR, float scale, vec2 off){
  vec2 k = vec2(1.0);
  if (uFit < 0.5){
    // cover: fill the frame, crop the overhang
    if (texAR > scrAR) k.x = scrAR / texAR;
    else               k.y = texAR / scrAR;
  } else {
    // contain: whole frame visible, letterboxed to the ink colour
    if (texAR > scrAR) k.y = texAR / scrAR;
    else               k.x = scrAR / texAR;
  }
  return (uv - 0.5) * k / max(scale, 0.05) + 0.5 + off + uReg.xy;
}

/* returns -1.0 when the sample falls outside the source */
float sampleLayer(sampler2D t, vec2 uv, float texAR, float scrAR, float scale, vec2 off){
  vec2 c = coverUV(uv, texAR, scrAR, scale, off);
  if (c.x < 0.0 || c.x > 1.0 || c.y < 0.0 || c.y > 1.0) return -1.0;
  return lumOf(texture2D(t, c).rgb);
}

float blendPair(float base, float top, float mode, float w){
  float r;
  if      (mode < 0.5) r = 1.0 - (1.0 - base) * (1.0 - top);  // screen
  else if (mode < 1.5) r = max(base, top);                    // lighten
  else if (mode < 2.5) r = base * top;                        // multiply
  else if (mode < 3.5) r = abs(base - top);                   // difference
  else if (mode < 4.5) r = (base + top) * 0.5;                // average
  else if (mode < 5.5) r = top;                               // dissolve
  else if (mode < 6.5){
    // negate: where the incoming clip is dark, the picture underneath flips
    // to its negative. Dark over dark reads as light instead of stacking
    // into a heavier shadow, and the flipped area keeps its own tones.
    r = mix(base, 1.0 - base, 1.0 - top);
  } else {
    // solarize: only the places where BOTH are dark flip; everything else
    // takes the lighter of the two, so highlights never muddy.
    float ov = (1.0 - base) * (1.0 - top);
    float m  = max(base, top);
    r = mix(m, 1.0 - m, ov);
  }
  return mix(base, r, w);
}

/* Matte: restrict a layer to the light or dark regions of the base clip, so a
   texture reads as showing *through* the subject rather than sitting over it. */
float matteFactor(float mode, float baseL){
  if (mode < 0.5) return 1.0;
  float e = smoothstep(uMaskCtl.x - uMaskCtl.y, uMaskCtl.x + uMaskCtl.y, baseL);
  if (mode < 1.5) return e;          // through the light areas
  return 1.0 - e;                    // through the dark areas
}

void main(){
  vec2 uv = vUv;
  float scrAR = uRes.x / uRes.y;

  // Pointer influence, measured in aspect-corrected space so the falloff
  // stays circular rather than stretching with the window.
  float infl = 0.0;
  vec2 toP = vec2(0.0);
  if (uPtrMode > 0.5){
    toP = (uv - uPtr.xy) * vec2(scrAR, 1.0);
    infl = 1.0 - smoothstep(0.0, max(uPtr.z, 0.001), length(toP));
  }

  // repel: push the sampling grid away from the cursor
  if (uPtrMode > 2.5 && uPtrMode < 3.5 && infl > 0.0){
    uv += normalize(toP + vec2(1e-5)) / vec2(scrAR, 1.0) * infl * uPtr.w * 0.09;
  }

  // disperse: scatter along the drag, then settle back
  if (uPtrMode > 3.5){
    vec2 push = vec2(0.0);
    float tot = 0.0;
    for (int i = 0; i < TRAIL; i++){
      float amp = uTrail[i].z;
      if (amp > 0.002){
        vec2 d = (uv - uTrail[i].xy) * vec2(scrAR, 1.0);
        float f = (1.0 - smoothstep(0.0, uDisperse.x, length(d))) * amp;
        push += normalize(d + vec2(1e-5)) * f;
        tot  += f;
      }
    }
    if (tot > 0.001){
      // radial shove away from the path
      uv += push / vec2(scrAR, 1.0) * uDisperse.y * 0.11;
      // plus per-cell jitter, so the dots scatter as grains rather than
      // the whole picture sliding as one sheet
      vec2 cell = floor(gl_FragCoord.xy / max(uDot, 1.0));
      vec2 jit = vec2(hash(cell, 7.3), hash(cell, 19.1)) - 0.5;
      uv += jit * min(tot, 1.6) * uDisperse.y * 0.07;
    }
  }

  // focus: resolve finer detail near the cursor
  float dotSize = uDot;
  if (uPtrMode > 0.5 && uPtrMode < 1.5){
    dotSize = mix(uDot, max(1.0, uDot * 0.28), infl * uPtr.w);
  }

  // Sampling coords snap to the dot grid when cell sampling is on, so each
  // halftone cell carries one tone rather than shimmering mid-cell.
  vec2 uvq = uv;
  if (uCell > 0.5){
    vec2 px = uv * uRes;
    px = (floor(px / dotSize) + 0.5) * dotSize;
    uvq = px / uRes;
  }

  float v = 0.0;
  float s;

  // Layer A is the base, and its luminance is also what the matte reads from.
  float baseL = 0.0;
  if (uArA.y > 0.5){
    s = sampleLayer(uTexA, uvq, uArA.x, scrAR, uParA.y, uOffA);
    if (s >= 0.0){ baseL = s; v = mix(v, s, uParA.x); }
  }
  if (uArB.y > 0.5){
    s = sampleLayer(uTexB, uvq, uArB.x, scrAR, uParB.y, uOffB);
    if (s >= 0.0) v = blendPair(v, s, uParB.z, uParB.x * matteFactor(uParB.w, baseL));
  }
  if (uArC.y > 0.5){
    s = sampleLayer(uTexC, uvq, uArC.x, scrAR, uParC.y, uOffC);
    if (s >= 0.0) v = blendPair(v, s, uParC.z, uParC.x * matteFactor(uParC.w, baseL));
  }

  if (uStillPar.x > 0.5){
    vec2 r = (uvq - uStillRect.xy) / uStillRect.zw;
    if (r.x >= 0.0 && r.x <= 1.0 && r.y >= 0.0 && r.y <= 1.0){
      float sl = lumOf(texture2D(uStill, r).rgb);
      // feather the insert so it reads as a ghosted frame, not a pasted box
      vec2 fw = smoothstep(0.0, 0.14, r) * smoothstep(0.0, 0.14, 1.0 - r);
      v = blendPair(v, sl, uStillPar.z, uStillPar.y * fw.x * fw.y);
    }
  }

  // tone. uReg.z is the print-to-print exposure wobble.
  v = (v - 0.5) * uContrast + 0.5 + uExposure + uReg.z;
  v = mix(v, 1.0 - v, uInvert);

  float thr = uThresh;
  if (uPtrMode > 1.5 && uPtrMode < 2.5) thr += infl * uPtr.w * 0.45;  // reveal

  vec3 col;

  // Knockout runs before grain and before the dither, so a flat wall drops
  // out to bare ground with no dots in it at all.
  if (v >= uKnock.x){
    col = uPaper;
  } else if (v <= uKnock.y){
    col = uInk;
  } else {
    // scan grain: high-frequency speckle plus a slower mottle, both stepped
    // on the hold clock so they stutter with the frames instead of boiling
    if (uGrain > 0.001){
      vec2 px = uv * uRes;
      float fine   = hash(floor(px), uSeed) - 0.5;
      float mottle = hash(floor(px / 9.0), uSeed * 0.5) - 0.5;
      v += fine * uGrain + mottle * uGrain * 0.55;
    }

    v = clamp(v, 0.0, 1.0);

    float b;
    vec2 g = gl_FragCoord.xy / max(dotSize, 1.0);
    if      (uMatrix < 3.0) b = bayer2(g);
    else if (uMatrix < 6.0) b = bayer4(g);
    else                    b = bayer8(g);

    col = mix(uInk, uPaper, step(b, v + thr));
  }

  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
(function(){
"use strict";

/* ==========================================================================
   Stand-in footage. Swapped out the moment a real file is dropped in.

/* ==========================================================================
   GL
   ========================================================================== */
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl", {antialias:false, preserveDrawingBuffer:true});
const status = document.getElementById("statusline");

if (!gl){
  status.textContent = "this browser has no WebGL — the effect can't run here";
  return;
}

const VERT = `
attribute vec2 aPos;
varying vec2 vUv;
void main(){
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

function compile(type, src){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(sh));
    status.textContent = "shader failed to compile — see console";
    return null;
  }
  return sh;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById("frag").textContent));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, "aPos");
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const U = {};
["uRes","uTexA","uTexB","uTexC","uStill","uArA","uArB","uArC","uParA","uParB","uParC",
 "uOffA","uOffB","uOffC","uStillRect","uStillPar","uExposure","uContrast","uInvert",
 "uGrain","uSeed","uMatrix","uDot","uThresh","uCell","uFit","uInk","uPaper","uMaskCtl",
 "uKnock","uReg","uPtr","uPtrMode","uDisperse"]
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));
U.uTrail = gl.getUniformLocation(prog, "uTrail[0]");

function makeTex(unit){
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE,
                new Uint8Array([0,0,0,255]));
  return t;
}
// Video and canvas sources arrive with their origin at the top-left, while GL
// textures start at the bottom-left. Without this every frame renders flipped.
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

const TEX = [makeTex(0), makeTex(1), makeTex(2)];
const STILL_TEX = makeTex(3);
gl.uniform1i(U.uTexA, 0);
gl.uniform1i(U.uTexB, 1);
gl.uniform1i(U.uTexC, 2);
gl.uniform1i(U.uStill, 3);

/* ==========================================================================
   Media
   ========================================================================== */
const videos = [null, null, null];
const stills = [];

// Browsers only reliably decode frames for video elements that are in the
// document. Park them in a 1px invisible box — never display:none, which
// stops decoding altogether.
const vault = document.createElement("div");
vault.setAttribute("aria-hidden","true");
vault.style.cssText =
  "position:fixed;left:0;top:0;width:1px;height:1px;overflow:hidden;" +
  "opacity:0;pointer-events:none;z-index:-1";
document.body.appendChild(vault);

function loadVideo(slot, url, name){
  if (videos[slot] && videos[slot].parentNode) videos[slot].remove();
  const v = document.createElement("video");
  v.muted = true; v.loop = true; v.playsInline = true; v.preload = "auto";
  v.setAttribute("playsinline",""); v.setAttribute("muted","");
  v.crossOrigin = "anonymous";
  v.src = url;
  vault.appendChild(v);
  v.addEventListener("loadeddata", () => {
    S.layers[slot].on = true;
    S.layers[slot].name = name;
    renderRail();
    v.playbackRate = Math.max(0.1, S.speed);
    if (S.playing) v.play().catch(()=>{});
    touchStatus();
  });
  v.addEventListener("error", () => {
    status.textContent = "couldn't decode " + name + " — try an mp4 or webm";
  });
  videos[slot] = v;
}

function loadStill(url, name){
  const im = new Image();
  im.crossOrigin = "anonymous";
  im.onload = () => { stills.push({img:im, name}); touchStatus(); };
  im.src = url;
}

function touchStatus(){
  const n = videos.filter(Boolean).length;
  status.textContent = n + " clip" + (n===1?"":"s") + " · " + stills.length +
    " still" + (stills.length===1?"":"s") + " · " + Math.round(S.holdFps) + " fps hold";
}

loadVideo(0, STANDIN.look, "stand-in / look");
loadVideo(1, STANDIN.hair, "stand-in / hair");
loadVideo(2, STANDIN.ripple, "stand-in / ripples");
STANDIN.stills.forEach((d,i) => loadStill(d, "stand-in " + (i+1)));

/* ==========================================================================
   File intake
   ========================================================================== */
function intake(files){
  let slot = -1;
  Array.from(files).forEach(f => {
    const url = URL.createObjectURL(f);
    if (f.type.startsWith("video")){
      slot = videos.findIndex((v,i) => !v || S.layers[i].name.startsWith("stand-in"));
      if (slot < 0) slot = 0;
      loadVideo(slot, url, f.name);
      // first real clip clears the other stand-in so it isn't ghosting her footage
      videos.forEach((v,i) => {
        if (i !== slot && S.layers[i].name.startsWith("stand-in")){
          S.layers[i].on = false;
        }
      });
    } else if (f.type.startsWith("image")){
      if (stills.every(s => s.name.startsWith("stand-in"))) stills.length = 0;
      loadStill(url, f.name);
    }
  });
  renderRail();
}

const stage = document.getElementById("stage");
["dragenter","dragover"].forEach(e =>
  stage.addEventListener(e, ev => { ev.preventDefault(); stage.classList.add("drag"); }));
["dragleave","drop"].forEach(e =>
  stage.addEventListener(e, ev => { ev.preventDefault(); stage.classList.remove("drag"); }));
stage.addEventListener("drop", ev => { if (ev.dataTransfer) intake(ev.dataTransfer.files); });

const filepick = document.getElementById("filepick");
let pickTarget = null;
filepick.addEventListener("change", () => {
  if (filepick.files.length) {
    if (pickTarget === null) intake(filepick.files);
    else {
      const f = filepick.files[0];
      if (f.type.startsWith("video")) loadVideo(pickTarget, URL.createObjectURL(f), f.name);
      else intake(filepick.files);
    }
  }
  filepick.value = "";
});

/* ==========================================================================
   Control rail
   ========================================================================== */
function slider(parent, label, min, max, step, get, set, fmt){
  const row = document.createElement("div");
  row.className = "row";
  const l = document.createElement("label");
  l.textContent = label;
  const i = document.createElement("input");
  i.type = "range"; i.min = min; i.max = max; i.step = step; i.value = get();
  const o = document.createElement("output");
  const show = () => o.textContent = (fmt || (x => (+x).toFixed(2)))(get());
  l.htmlFor = i.id = "c" + Math.random().toString(36).slice(2,8);
  i.addEventListener("input", () => { set(parseFloat(i.value)); show(); afterChange(); });
  show();
  row.append(l, i, o);
  parent.appendChild(row);
  return i;
}

function dropdown(parent, label, options, get, set, rerender){
  const row = document.createElement("div");
  row.className = "row";
  const l = document.createElement("label");
  l.textContent = label;
  const sel = document.createElement("select");
  sel.style.gridColumn = "2 / -1";
  sel.setAttribute("aria-label", label);
  options.forEach((name, idx) => {
    const op = document.createElement("option");
    op.value = idx; op.textContent = name;
    if (get() === idx) op.selected = true;
    sel.appendChild(op);
  });
  sel.addEventListener("change", () => {
    set(parseInt(sel.value, 10));
    if (rerender) renderRail();
  });
  row.append(l, sel);
  parent.appendChild(row);
}

function seg(parent, label, options, get, set){
  const row = document.createElement("div");
  row.className = "row";
  const l = document.createElement("label");
  l.textContent = label;
  const box = document.createElement("div");
  box.className = "seg";
  box.style.gridColumn = "2 / -1";
  options.forEach(([txt, val]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = txt;
    b.setAttribute("aria-pressed", String(get() === val));
    b.addEventListener("click", () => { set(val); renderRail(); afterChange(); });
    box.appendChild(b);
  });
  row.append(l, box);
  parent.appendChild(row);
}

function renderLayers(){
  const host = document.getElementById("layers");
  host.textContent = "";
  S.layers.forEach((L, i) => {
    const card = document.createElement("div");
    card.className = "layer" + (videos[i] ? "" : " empty");

    const head = document.createElement("div");
    head.className = "layer-head";
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = ["A","B","C"][i];
    const nm = document.createElement("span");
    nm.className = "layer-name";
    nm.textContent = videos[i] ? L.name : "no clip";
    const pick = document.createElement("button");
    pick.className = "mini"; pick.type = "button"; pick.textContent = "load";
    pick.addEventListener("click", () => { pickTarget = i; filepick.click(); });
    const tog = document.createElement("button");
    tog.className = "mini"; tog.type = "button";
    tog.textContent = L.on ? "on" : "off";
    tog.style.color = L.on ? "var(--safelight)" : "";
    tog.addEventListener("click", () => { L.on = !L.on; renderRail(); });
    head.append(tag, nm, pick, tog);
    card.appendChild(head);

    if (i > 0){
      dropdown(card, "blend", BLENDS, () => L.blend, v => L.blend = v);
      dropdown(card, "matte", MATTES, () => L.matte, v => L.matte = v, true);
    }

    slider(card, "weight", 0, 1, 0.01, () => L.weight, v => L.weight = v);
    slider(card, "scale",  0.4, 2.5, 0.01, () => L.scale, v => L.scale = v);
    slider(card, "shift x", -0.4, 0.4, 0.005, () => L.ox, v => L.ox = v);
    slider(card, "shift y", -0.4, 0.4, 0.005, () => L.oy, v => L.oy = v);

    if (i > 0){
      seg(card, "appears", [["always",0],["in pulses",1]], () => L.trig, v => L.trig = v);
      if (L.trig === 1){
        dropdown(card, "switch", SWITCHES, () => L.sw, v => L.sw = v, true);
        slider(card, "every", 1, 30, 0.5, () => L.every, v => L.every = v,
               x => (+x).toFixed(1) + "s");
        slider(card, "for", 0.2, 12, 0.1, () => L.hold, v => L.hold = v,
               x => (+x).toFixed(1) + "s");
        // a hard cut has no transition to give a length to
        if (L.sw !== 0){
          slider(card, L.sw === 1 ? "glitch for" : "fade", 0, 4, 0.05,
                 () => L.fade, v => L.fade = v, x => (+x).toFixed(2) + "s");
        }
        const fire = document.createElement("button");
        fire.className = "mini"; fire.type = "button";
        fire.textContent = "trigger now";
        fire.style.alignSelf = "flex-start";
        fire.addEventListener("click", () => { L.fire = performance.now() / 1000; });
        card.appendChild(fire);
      }
    }

    host.appendChild(card);
  });

  // matte controls only matter once some layer is actually matted
  if (S.layers.some((L, i) => i > 0 && L.on && L.matte > 0)){
    const m = document.createElement("div");
    m.className = "layer";
    const h = document.createElement("div");
    h.className = "layer-head";
    const t = document.createElement("span");
    t.className = "tag"; t.textContent = "MAT";
    const n = document.createElement("span");
    n.className = "layer-name"; n.textContent = "matte edge";
    h.append(t, n);
    m.appendChild(h);
    slider(m, "cutoff", 0, 1, 0.01, () => S.matte.threshold, v => S.matte.threshold = v);
    slider(m, "softness", 0.01, 0.6, 0.01, () => S.matte.softness, v => S.matte.softness = v);
    host.appendChild(m);
  }

  // flickering stills
  const card = document.createElement("div");
  card.className = "layer" + (stills.length ? "" : " empty");
  const head = document.createElement("div");
  head.className = "layer-head";
  const tag = document.createElement("span");
  tag.className = "tag"; tag.textContent = "INS";
  const nm = document.createElement("span");
  nm.className = "layer-name";
  nm.textContent = "small inserts" + (stills.length ? " · " + stills.length : "");
  const pick = document.createElement("button");
  pick.className = "mini"; pick.type = "button"; pick.textContent = "load";
  pick.addEventListener("click", () => { pickTarget = null; filepick.click(); });
  const tog = document.createElement("button");
  tog.className = "mini"; tog.type = "button";
  tog.textContent = S.stills.on ? "on" : "off";
  tog.style.color = S.stills.on ? "var(--safelight)" : "";
  tog.addEventListener("click", () => { S.stills.on = !S.stills.on; renderRail(); });
  head.append(tag, nm, pick, tog);
  card.appendChild(head);

  dropdown(card, "blend", BLENDS, () => S.stills.blend, v => S.stills.blend = v);
  slider(card, "opacity", 0, 1, 0.01, () => S.stills.opacity, v => S.stills.opacity = v);
  slider(card, "rate", 0, 1, 0.01, () => S.stills.rate, v => S.stills.rate = v);
  slider(card, "size", 0.08, 0.7, 0.01, () => S.stills.size, v => S.stills.size = v);
  document.getElementById("layers").appendChild(card);
}

function renderRail(){
  const rail = document.querySelector(".rail");
  const keepScroll = rail ? rail.scrollTop : 0;
  renderLayers();

  const tone = document.getElementById("tone");
  tone.textContent = "";
  slider(tone, "exposure", -0.4, 0.4, 0.005, () => S.exposure, v => S.exposure = v);
  slider(tone, "contrast", 0.4, 3.0, 0.01, () => S.contrast, v => S.contrast = v);
  slider(tone, "scan grain", 0, 0.35, 0.005, () => S.grain, v => S.grain = v);
  seg(tone, "polarity", [["normal",0],["flipped",1]], () => S.invert, v => S.invert = v);
  slider(tone, "blank above", 0.3, 1.0, 0.005, () => S.knock.above,
         v => S.knock.above = v, x => (+x) >= 0.999 ? "off" : (+x).toFixed(2));
  slider(tone, "solid below", 0.0, 0.7, 0.005, () => S.knock.below,
         v => S.knock.below = v, x => (+x) <= 0.001 ? "off" : (+x).toFixed(2));
  const kh = document.createElement("p");
  kh.className = "hint";
  kh.textContent = "Pull “blank above” down until the wall drops out. " +
    "Those areas render as bare ground with no dots in them.";
  tone.appendChild(kh);

  const dith = document.getElementById("dither");
  dith.textContent = "";
  seg(dith, "matrix", [["2×2",2],["4×4",4],["8×8",8]], () => S.matrix, v => S.matrix = v);
  slider(dith, "dot size", 1, 14, 0.5, () => S.dot, v => S.dot = v, x => (+x).toFixed(1) + "px");
  slider(dith, "threshold", -0.35, 0.35, 0.005, () => S.thresh, v => S.thresh = v);
  seg(dith, "sampling", [["per cell",1],["per pixel",0]], () => S.cell, v => S.cell = v);

  const mot = document.getElementById("motion");
  mot.textContent = "";
  slider(mot, "frame rate", 1, 30, 1, () => S.holdFps, v => S.holdFps = v,
         x => x + " fps");
  slider(mot, "speed", 0.1, 2, 0.05, () => S.speed, v => { S.speed = v; applySpeed(); },
         x => (+x).toFixed(2) + "×");
  slider(mot, "judder", 0, 1, 0.01, () => S.judder, v => S.judder = v);
  slider(mot, "drift", 0, 1, 0.01, () => S.drift, v => S.drift = v);
  slider(mot, "print wobble", 0, 1, 0.01, () => S.printVar, v => S.printVar = v);
  const mh = document.createElement("p");
  mh.className = "hint";
  mh.textContent = "Frame rate is how often a new frame lands. Speed is how " +
    "much movement happens between them — drop both for a hand-shot feel.";
  mot.appendChild(mh);

  const ptrHost = document.getElementById("pointer");
  ptrHost.textContent = "";
  dropdown(ptrHost, "reacts", PTR_MODES, () => S.ptr.mode,
           v => S.ptr.mode = v, true);
  if (S.ptr.mode > 0){
    slider(ptrHost, "radius", 0.05, 1.2, 0.01, () => S.ptr.radius,
           v => S.ptr.radius = v);
    slider(ptrHost, "strength", 0, 1, 0.01, () => S.ptr.strength,
           v => S.ptr.strength = v);
    if (S.ptr.mode === 4){
      slider(ptrHost, "settle", 0.1, 4, 0.05, () => S.ptr.settle,
             v => S.ptr.settle = v, x => (+x).toFixed(2) + "s");
    }
    const ph = document.createElement("p");
    ph.className = "hint";
    ph.textContent = ["",
      "Dots get finer near the cursor, so detail resolves where you point.",
      "The image emerges from the ground where the cursor passes.",
      "The halftone grid pushes away from the cursor.",
      "Drag across the image to scatter the grain. It settles back once the " +
      "cursor leaves — “settle” is how long that takes."][S.ptr.mode];
    ptrHost.appendChild(ph);
  }

  const out = document.getElementById("output");
  out.textContent = "";
  seg(out, "framing", [["cover",0],["contain",1]], () => S.fit, v => S.fit = v);
  const cols = document.createElement("div");
  cols.className = "grid2";
  [["ink","ink"],["paper","paper"]].forEach(([label, key]) => {
    const w = document.createElement("div");
    const lb = document.createElement("label");
    lb.style.cssText = "font-size:11px;color:var(--dim);display:block;margin-bottom:4px";
    lb.textContent = label;
    const ci = document.createElement("input");
    ci.type = "color"; ci.value = S[key];
    ci.addEventListener("input", () => { S[key] = ci.value; });
    w.append(lb, ci);
    cols.appendChild(w);
  });
  out.appendChild(cols);

  const copyBtn = document.createElement("button");
  copyBtn.className = "btn primary"; copyBtn.type = "button";
  copyBtn.textContent = "copy settings";
  copyBtn.addEventListener("click", () => {
    ta.value = exportSettings();
    ta.select();
    navigator.clipboard.writeText(ta.value)
      .then(() => { copyBtn.textContent = "copied"; setTimeout(() => copyBtn.textContent = "copy settings", 1400); })
      .catch(() => { copyBtn.textContent = "select & copy below"; });
  });
  out.appendChild(copyBtn);

  const frameBtn = document.createElement("button");
  frameBtn.className = "btn"; frameBtn.type = "button";
  frameBtn.textContent = "copy frame as image";
  frameBtn.addEventListener("click", () => {
    canvas.toBlob(b => {
      if (!b || !navigator.clipboard || !window.ClipboardItem){
        frameBtn.textContent = "clipboard blocked here";
        setTimeout(() => frameBtn.textContent = "copy frame as image", 1600);
        return;
      }
      navigator.clipboard.write([new ClipboardItem({"image/png": b})])
        .then(() => { frameBtn.textContent = "frame copied"; })
        .catch(() => { frameBtn.textContent = "clipboard blocked here"; })
        .finally(() => setTimeout(() => frameBtn.textContent = "copy frame as image", 1600));
    });
  });
  out.appendChild(frameBtn);

  const ta = document.createElement("textarea");
  ta.readOnly = true;
  ta.setAttribute("aria-label", "exported settings");
  ta.value = exportSettings();
  out.appendChild(ta);

  const hint = document.createElement("p");
  hint.className = "hint";
  hint.innerHTML = "Paste this into the <code>CONFIG</code> block of <code>dither-cover.html</code> to move the look onto your own site.";
  out.appendChild(hint);

  if (rail) rail.scrollTop = keepScroll;
}

function afterChange(){ touchStatus(); }

function exportSettings(){
  const cfg = {
    layers: S.layers.map((L,i) => ({
      src: videos[i] && !L.name.startsWith("stand-in") ? L.name : null,
      on:L.on, weight:+L.weight.toFixed(3), scale:+L.scale.toFixed(3),
      ox:+L.ox.toFixed(3), oy:+L.oy.toFixed(3), blend:BLENDS[L.blend],
      matte:["off","light","dark"][L.matte],
      appears: L.trig ? "pulse" : "always", switch:SWITCHES[L.sw],
      every:+L.every.toFixed(2), hold:+L.hold.toFixed(2), fade:+L.fade.toFixed(2)
    })),
    matte:{threshold:+S.matte.threshold.toFixed(3), softness:+S.matte.softness.toFixed(3)},
    stills:{on:S.stills.on, opacity:+S.stills.opacity.toFixed(3),
            blend:BLENDS[S.stills.blend], rate:+S.stills.rate.toFixed(3),
            size:+S.stills.size.toFixed(3)},
    tone:{exposure:+S.exposure.toFixed(3), contrast:+S.contrast.toFixed(3),
          grain:+S.grain.toFixed(3), invert:!!S.invert},
    dither:{matrix:S.matrix, dot:S.dot, threshold:+S.thresh.toFixed(3), cellSample:!!S.cell},
    knockout:{blankAbove:+S.knock.above.toFixed(3), solidBelow:+S.knock.below.toFixed(3)},
    motion:{holdFps:S.holdFps, speed:+S.speed.toFixed(2), judder:+S.judder.toFixed(2),
            drift:+S.drift.toFixed(2), printWobble:+S.printVar.toFixed(2)},
    pointer:{mode:PTR_MODES[S.ptr.mode], radius:+S.ptr.radius.toFixed(2),
             strength:+S.ptr.strength.toFixed(2), settle:+S.ptr.settle.toFixed(2)},
    framing: S.fit ? "contain" : "cover",
    colors:{ink:S.ink, paper:S.paper}
  };
  return JSON.stringify(cfg, null, 2);
}

/* transport — in the masthead, because it's the control you reach for most */
function applySpeed(){
  videos.forEach(v => { if (v) v.playbackRate = Math.max(0.1, S.speed); });
}

const transport = document.getElementById("transport");
function setPlaying(on){
  S.playing = on;
  videos.forEach(v => {
    if (!v) return;
    on ? v.play().catch(()=>{}) : v.pause();
  });
  transport.textContent = on ? "pause" : "play";
  transport.dataset.paused = String(!on);
  transport.setAttribute("aria-label", on ? "Pause playback" : "Resume playback");
}
transport.addEventListener("click", () => setPlaying(!S.playing));
setPlaying(true);

document.addEventListener("keydown", e => {
  if (e.code !== "Space") return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "BUTTON")) return;
  e.preventDefault();
  setPlaying(!S.playing);
});

/* presets */
const presetHost = document.getElementById("presets");
Object.keys(PRESETS).forEach(name => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = name;
  b.addEventListener("click", () => {
    Object.assign(S, PRESETS[name]);
    applySpeed();
    renderRail();
  });
  presetHost.appendChild(b);
});

/* ==========================================================================
   Render loop
   ========================================================================== */
function hexToRgb(h){
  const n = parseInt(h.slice(1), 16);
  return [((n >> 16) & 255)/255, ((n >> 8) & 255)/255, (n & 255)/255];
}

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = stage.getBoundingClientRect();
  const w = Math.max(2, Math.floor(r.width));
  const h = Math.max(2, Math.floor(r.height));
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  const pw = Math.floor(w * dpr), ph = Math.floor(h * dpr);
  if (canvas.width !== pw || canvas.height !== ph){
    canvas.width = pw; canvas.height = ph;
  }
  gl.viewport(0, 0, canvas.width, canvas.height);
}
new ResizeObserver(resize).observe(stage);
resize();

let nextTick = 0, stepIdx = 0;
const reg = {x:0, y:0, z:0};
const ptr = {x:0.5, y:0.5};
let stillPick = {on:0, x:0.1, y:0.1, w:0.2, h:0.25, idx:0};

/* A short ring buffer of where the cursor has been. Each sample carries its
   own birth time and fades independently, which is what makes the grain
   settle back after the cursor leaves instead of snapping. */
const TRAIL_N = 8;
const trail = Array.from({length:TRAIL_N}, () => ({x:0.5, y:0.5, t:-1e9}));
const trailBuf = new Float32Array(TRAIL_N * 4);
let trailHead = 0, lastSample = 0;

stage.addEventListener("pointermove", e => {
  const r = stage.getBoundingClientRect();
  ptr.x = (e.clientX - r.left) / Math.max(1, r.width);
  ptr.y = 1 - (e.clientY - r.top) / Math.max(1, r.height);   // uv origin is bottom-left
  const t = performance.now();
  if (t - lastSample > 40){            // sample the path, don't flood it
    lastSample = t;
    trailHead = (trailHead + 1) % TRAIL_N;
    trail[trailHead] = {x:ptr.x, y:ptr.y, t};
  }
});
stage.addEventListener("pointerleave", () => { ptr.x = 0.5; ptr.y = 0.5; });

function packTrail(now){
  const tau = Math.max(60, S.ptr.settle * 1000);
  for (let i = 0; i < TRAIL_N; i++){
    const s = trail[i];
    const amp = Math.exp(-(now - s.t) / tau);
    trailBuf[i*4]   = s.x;
    trailBuf[i*4+1] = s.y;
    trailBuf[i*4+2] = amp > 0.002 ? amp : 0;
    trailBuf[i*4+3] = 0;
  }
  return trailBuf;
}

/* The raw trapezoid: 0 before, ramping up, held at 1, ramping down. */
function ramp(local, fade, hold){
  if (local < 0) return 0;
  if (local < fade) return local / Math.max(0.001, fade);
  if (local < fade + hold) return 1;
  if (local < fade * 2 + hold){
    return 1 - (local - fade - hold) / Math.max(0.001, fade);
  }
  return 0;
}

function rawRamp(L, t){
  if (L.fire > t - (L.hold + L.fade * 2)){
    const local = t - (L.fire - (L.hold + L.fade * 2));
    const e = ramp(local, L.fade, L.hold);
    if (e > 0) return e;
  }
  if (L.trig === 0) return 1;
  const period = Math.max(L.hold + L.fade * 2 + 0.2, L.every);
  return ramp(t % period, L.fade, L.hold);
}

/* How present a layer is, decided ONCE per held frame — never per render
   frame, or any transition smears into a 60fps dissolve no matter how slow
   the frame rate is set. The switch style decides what happens in between:
     cut      the layer is simply in or out, changing on a frame boundary
     flicker  the two clips trade frames at random across the window, the
              same idea as the Bayer matrix but dithered in time
     fade     a real ramp, still quantised to the frame clock                */
function computeEnv(L, t){
  const r = rawRamp(L, t);
  if (L.sw === 0) return r >= 0.5 ? 1 : 0;
  if (L.sw === 1) return Math.random() < r ? 1 : 0;
  return r;
}

function step(now){
  // A real shutter, not a clock: each frame decides when the next one lands,
  // so judder can make the cadence irregular the way hand-shot animation is.
  const newStep = now >= nextTick;
  if (newStep){
    const base = 1000 / Math.max(1, S.holdFps);
    const wobble = 1 + (Math.random() - 0.5) * 2 * S.judder * 0.6;
    nextTick = now + base * wobble;
    stepIdx++;

    // registration drift — each printed frame sits slightly off-register
    reg.x = (Math.random() - 0.5) * S.drift * 0.035;
    reg.y = (Math.random() - 0.5) * S.drift * 0.035;
    reg.z = (Math.random() - 0.5) * S.printVar * 0.22;

    // layer presence is latched here and held for the whole frame
    const tSec = now / 1000;
    S.layers.forEach(L => { L.env = computeEnv(L, tSec); });
  }

  // Textures refresh only on hold ticks — this is the frame decimation that
  // gives the flip-book stutter, rather than a smooth 60fps video.
  if (newStep){
    videos.forEach((v, i) => {
      if (v && v.readyState >= 2){
        gl.activeTexture(gl.TEXTURE0 + i);
        gl.bindTexture(gl.TEXTURE_2D, TEX[i]);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
        try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, v); }
        catch(e){}
      }
    });

    if (S.stills.on && stills.length){
      const r = Math.random();
      if (r < S.stills.rate){
        const s = stills[Math.floor(Math.random() * stills.length)];
        const ar = s.img.naturalWidth / Math.max(1, s.img.naturalHeight);
        const h = S.stills.size;
        const w = h * ar * (canvas.height / Math.max(1, canvas.width));
        stillPick = {
          on:1,
          x: Math.random() * (1 - w),
          y: Math.random() * (1 - h),
          w, h
        };
        gl.activeTexture(gl.TEXTURE3);
        gl.bindTexture(gl.TEXTURE_2D, STILL_TEX);
        try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, s.img); }
        catch(e){}
      } else {
        stillPick.on = 0;
      }
    } else {
      stillPick.on = 0;
    }
  }

  gl.useProgram(prog);
  gl.uniform2f(U.uRes, canvas.width, canvas.height);

  const ar = i => {
    const v = videos[i];
    if (!v || !v.videoWidth) return 1.0;
    return v.videoWidth / v.videoHeight;
  };
  [["uArA","uParA","uOffA",0],["uArB","uParB","uOffB",1],["uArC","uParC","uOffC",2]]
    .forEach(([a, p, o, i]) => {
      const L = S.layers[i];
      const live = !!(videos[i] && videos[i].readyState >= 2) && L.on;
      gl.uniform2f(U[a], ar(i), live ? 1 : 0);
      gl.uniform4f(U[p], L.weight * L.env, L.scale, L.blend, L.matte);
      gl.uniform2f(U[o], L.ox, L.oy);
    });
  gl.uniform2f(U.uMaskCtl, S.matte.threshold, Math.max(0.005, S.matte.softness));

  gl.uniform4f(U.uStillRect, stillPick.x, stillPick.y, stillPick.w, stillPick.h);
  gl.uniform3f(U.uStillPar, stillPick.on, S.stills.opacity, S.stills.blend);

  gl.uniform1f(U.uExposure, S.exposure);
  gl.uniform1f(U.uContrast, S.contrast);
  gl.uniform1f(U.uInvert, S.invert);
  gl.uniform1f(U.uGrain, S.grain);
  gl.uniform1f(U.uSeed, stepIdx % 997);
  gl.uniform2f(U.uKnock, S.knock.above, S.knock.below);
  gl.uniform3f(U.uReg, reg.x, reg.y, reg.z);
  gl.uniform4f(U.uPtr, ptr.x, ptr.y, S.ptr.radius, S.ptr.strength);
  gl.uniform1f(U.uPtrMode, S.ptr.mode);
  gl.uniform2f(U.uDisperse, S.ptr.radius, S.ptr.strength);
  if (S.ptr.mode === 4) gl.uniform4fv(U.uTrail, packTrail(now));
  gl.uniform1f(U.uMatrix, S.matrix);
  gl.uniform1f(U.uDot, S.dot * Math.min(window.devicePixelRatio || 1, 2));
  gl.uniform1f(U.uThresh, S.thresh);
  gl.uniform1f(U.uCell, S.cell);
  gl.uniform1f(U.uFit, S.fit);
  gl.uniform3fv(U.uInk, hexToRgb(S.ink));
  gl.uniform3fv(U.uPaper, hexToRgb(S.paper));

  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(step);
}

renderRail();
requestAnimationFrame(step);

// autoplay can be refused until a gesture; recover quietly on first click
document.addEventListener("click", function once(){
  videos.forEach(v => { if (v && S.playing) v.play().catch(()=>{}); });
  document.removeEventListener("click", once);
});

window.__bench = {S, exportSettings};
